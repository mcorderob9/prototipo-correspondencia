<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Correspondencia · Prototipo</title>
  <link rel="stylesheet" href="estilos.css?v=3">
</head>
<body>
  <header class="cabecera">
    <div class="contenedor cabecera-fila">
      <div class="marca">
        <span class="marca-nombre">Correspondencia</span>
        <span class="etiqueta-prueba">Prototipo de prueba · datos ficticios</span>
      </div>
      <details class="opciones" id="opciones">
        <summary>Opciones de prueba</summary>
        <div class="opciones-menu" id="opciones-menu"></div>
      </details>
    </div>
    <div class="contenedor barra-rol">
      <div class="roles" role="group" aria-label="Rol en prueba">
        <span class="barra-etiqueta">Rol</span>
        <button class="rol" data-act="rol" data-id="Coordinación">Coordinación</button>
        <button class="rol" data-act="rol" data-id="Escritora">Escritora</button>
        <button class="rol" data-act="rol" data-id="Mediadora">Mediadora</button>
        <button class="rol" data-act="rol" data-id="Referente institucional">Referente</button>
      </div>
      <label id="persona-wrap" class="persona" hidden><span class="barra-etiqueta">Persona</span> <select id="persona"></select></label>
    </div>
  </header>

  <main class="contenedor">
    <div id="vista"></div>

    <section id="registro-panel" class="registro" hidden aria-labelledby="registro-titulo">
      <div class="registro-cab">
        <h2 id="registro-titulo">Registro de la demostración</h2>
        <button class="btn texto" data-act="registro">Ocultar</button>
      </div>
      <p class="nota">Para quien facilita el testeo. Lista las acciones de esta sesión, de la más reciente a la más antigua.</p>
      <ol id="registro"></ol>
    </section>
  </main>

  <div id="aviso" class="aviso-flotante" role="status" aria-live="polite"></div>

  <script src="datos.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
